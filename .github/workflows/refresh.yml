name: Refresh extensions.txt

# No paths filter: the ADO mirror force-pushes rewritten history, and a stale
# extensions.txt must be caught on every push to main, not only when the push's
# own diff touches the source lists. No-op runs exit without committing.
on:
  push:
    branches:
      - main

# Uses the workflow-scoped GITHUB_TOKEN — no personal access token required.
permissions:
  contents: write

concurrency:
  group: refresh-extensions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Push via the write deploy key: the main ruleset grants bypass to deploy
          # keys, not to the workflow token, so the auto-commit must authenticate as one.
          ssh-key: ${{ secrets.EXTENSIONS_REFRESH_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Regenerate extensions.txt
        run: npm run refresh-list

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions.txt
          if git diff --cached --quiet; then
            echo "extensions.txt already up to date."
          else
            git commit -m "Auto-update extensions.txt"
            git push
          fi
